name: Source qualification

on:
  pull_request:
  push:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          check-latest: false

      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Set runner-local build paths
        run: |
          set -euo pipefail
          printf 'UV_CACHE_DIR=%s\nUV_PROJECT_ENVIRONMENT=%s\n' \
            "$RUNNER_TEMP/skillstore-uv-cache" "$RUNNER_TEMP/skillstore-uv-env" >> "$GITHUB_ENV"

      - name: Install isolated test environment
        run: |
          set -euo pipefail
          uv venv --python "$(command -v python3)" "$UV_PROJECT_ENVIRONMENT"
          uv pip install --python "$UV_PROJECT_ENVIRONMENT/bin/python" -e . "pytest>=8"

      - name: Run focused package tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CI_REVISION"
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q \
            tests/test_release_gate.py \
            tests/test_targets.py \
            tests/test_tracking.py \
            tests/test_lifecycle.py

      - name: Qualify installed wheel and sdist on Linux
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CI_REVISION"
          scratch="$(mktemp -d "${RUNNER_TEMP%/}/skillstore-release-gate.XXXXXXXX")"
          chmod 700 "$scratch"
          python3 -I -B scripts/release_gate.py \
            --revision "$CI_REVISION" \
            --scratch "$scratch" \
            --expect-os Linux
