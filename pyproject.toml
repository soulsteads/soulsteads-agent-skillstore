[project]
name = "soulsteads-agent-skillstore"
version = "0.1.0"
description = "Centralized, reviewed distribution of portable Agent Skills packages: publish, discover, install, update, recover, and propose improvements."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.scripts]
skillstore = "skillstore.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillstore"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "skillstore/bundled_skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.data-files]
"share/soulsteads-agent-skillstore/skills/manage-skills" = ["skills/manage-skills/SKILL.md"]
