[project]
name = "soulsteads-agent-skillstore"
version = "0.2.0"
description = "Centralized, reviewed distribution of portable Agent Skills packages: publish, discover, install, update, recover, and propose improvements."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
soulsteads-skillstore = "skillstore.cli:main"
# Compatibility alias for existing Hermes and MCP configurations. New
# documentation and service units use soulsteads-skillstore.
skillstore = "skillstore.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillstore"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "skillstore/bundled_skills"
"plugins" = "skillstore/hermes_plugins"

[tool.hatch.build.targets.sdist]
exclude = ["/.github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.data-files]
"share/soulsteads-agent-skillstore/skills/manage-skills" = ["skills/manage-skills/SKILL.md"]
